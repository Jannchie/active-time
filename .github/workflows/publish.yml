name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    # windows-latest now maps to the VS2026 image, which node-gyp cannot
    # detect; windows-2025 still ships VS2022.
    runs-on: windows-2025

    steps:
      - name: Checkout git repo
        uses: actions/checkout@v4

      - name: Verify tag matches package versions
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION=$(node -p "require('./release/app/package.json').version")
          ROOT_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match release/app/package.json version $APP_VERSION" >&2
            exit 1
          fi
          if [ "$TAG_VERSION" != "$ROOT_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $ROOT_VERSION" >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            release/app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Build releases
        run: |
          pnpm run postinstall
          pnpm run build

      - name: Publish to GitHub
        env:
          # These values are used for code signing (skipped when unset)
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # This is used for uploading release assets to github
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --publish always --win
