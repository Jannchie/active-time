shellEmulator: true
trustPolicy: no-downgrade
# Only enforce trust checks for recently published packages; older ones
# (e.g. semver@6.3.1 from 2023) predate provenance and false-positive.
trustPolicyIgnoreExpired: 10080
# semver 5.7.2/6.3.1 (2023-07-10) predate provenance on the semver package and
# false-positive the no-downgrade check via electron-builder's dep tree.
trustPolicyExclude:
  - semver
onlyBuiltDependencies:
  - better-sqlite3
